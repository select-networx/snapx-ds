name: Publish package

# Publishes @select-networx/snapx-ds to GitHub Packages when a release is
# published. The release tag must match the package version, e.g. v0.0.1.
on:
  release:
    types:
      - published

jobs:
  publish:
    # GitHub-hosted: the org's self-hosted runners don't take jobs from
    # public repos, so on them this job stays queued.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@select-networx'

      - name: Check release tag matches package version
        run: |
          version="v$(node -p "require('./packages/components/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # prepack cleans and rebuilds dist/ before publishing.
      - name: Publish
        run: npm publish --workspace=packages/components
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
